name: Automated defensive improvement

on:
  # GitHub cron is UTC. 13:15 UTC is 15:15 SAST (UTC+2, no DST).
  # The daily trigger is filtered by check_schedule.py to every 48 hours.
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      run_improvement:
        description: "Run Codex and create a PR (otherwise only test the guards)"
        required: true
        default: false
        type: boolean

# A queued run waits for the active run. This closes the race in which two runs
# could both check for an open automation PR before either creates one.
concurrency:
  group: automated-defensive-improvement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check schedule and open PR guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - name: Check out trusted automation files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Evaluate the 48-hour schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.run_improvement || false }}
        run: |
          run_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python .github/scripts/check_schedule.py \
            --event "$EVENT_NAME" \
            --started-at "$run_started_at" \
            --force-run "$FORCE_RUN" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Check for an existing automation pull request
        id: open-pr
        if: steps.schedule.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open_pr="$({ gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("codex/defensive-improvement-")) | .html_url'; } | head -n 1)"

          if [[ -n "$open_pr" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Existing automation PR"
              echo "No new AI run was started because an earlier automation PR remains open: $open_pr"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to run Codex
        id: decision
        env:
          ELIGIBLE: ${{ steps.schedule.outputs.eligible }}
          BLOCKED: ${{ steps.open-pr.outputs.blocked }}
        run: |
          if [[ "$ELIGIBLE" == "true" && "$BLOCKED" != "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  improve:
    name: Implement, test, and propose one improvement
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-automation.txt

      # Dependency downloads happen before Codex starts. Codex itself receives
      # no network access through the :workspace permission profile.
      - name: Install the fixed offline test toolchain
        run: python -m pip install --disable-pip-version-check -r .github/requirements-automation.txt

      - name: Preserve trusted validators outside the checkout
        id: trusted
        run: |
          cp .github/scripts/validate_ai_change.sh "$RUNNER_TEMP/validate_ai_change.sh"
          cp .github/scripts/run_offline_tests.sh "$RUNNER_TEMP/run_offline_tests.sh"
          chmod 0555 "$RUNNER_TEMP/validate_ai_change.sh" "$RUNNER_TEMP/run_offline_tests.sh"
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the API secret is configured
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$HAS_OPENAI_API_KEY" != "true" ]]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Ask Codex for one defensive improvement
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/defensive-improvement.md
          codex-args: '["--ephemeral"]'

      - name: Validate the proposed change
        env:
          BASE_SHA: ${{ steps.trusted.outputs.base-sha }}
        run: "$RUNNER_TEMP/validate_ai_change.sh \"$BASE_SHA\""

      - name: Run tests without network access
        run: |
          unshare --user --map-root-user --net -- \
            "$RUNNER_TEMP/run_offline_tests.sh"

      - name: Commit and push the tested change
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/defensive-improvement-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: propose automated defensive improvement"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open an unmerged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body_file="$(mktemp)"
          {
            echo "## Automated defensive improvement"
            echo
            echo "Codex proposed one defensive cybersecurity improvement under the repository's offline-only automation policy. The trusted validation script and offline test suite passed before this pull request was opened."
            echo
            echo "- AI-assisted: yes (official OpenAI Codex GitHub Action)"
            echo "- Automatically merged: no"
            echo "- Live network scanning: prohibited"
            echo "- Workflow run: $RUN_URL"
            echo
            echo "A maintainer must review the code, test evidence, and security impact before deciding whether to merge."
          } > "$body_file"

          pr_url="$(gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Automated defensive improvement" \
            --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "### Pull request created" >> "$GITHUB_STEP_SUMMARY"
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a clear failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Automation failed"
            echo "No pull request was created by this run. Review the first failed step and its annotations: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
